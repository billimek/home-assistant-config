################################################
## Garage door notifications and scheduled close
################################################
## Replaces the Node-RED Garage tab flows: open notifications, "still open and
## nobody home", the 120 minute open nag and the 10pm auto-close.
## The Tesla geofence auto open/close and the Inovelli LED indicators are separate.
## The iOS push category (garage / garage2) gives the phone the Open/Close
## action buttons handled by the ios_action_* automations in garage.yaml.

## A garage door opens: push to Jeff when someone is home, Jeff and Jen when nobody is.
- id: garage_door_opened_notify
  alias: 'Notify when a garage door opens'
  mode: parallel
  max: 4
  trigger:
    - platform: state
      entity_id:
        - cover.jeff_garage_door
        - cover.jen_garage_door
      to: 'open'
      not_from:
        - unavailable
        - unknown
  condition:
    - condition: state
      entity_id: input_boolean.notify_garage_doors_home
      state: 'on'
  variables:
    doors:
      cover.jeff_garage_door:
        title: Jeff's Garage Door
        category: garage
      cover.jen_garage_door:
        title: Jen's Garage Door
        category: garage2
    door: "{{ doors[trigger.entity_id] }}"
  action:
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: zone.home
              above: 0
          sequence:
            - action: notify.mobile_app_jeffsphone
              data:
                title: "{{ door.title }}"
                message: "{{ door.title }} is open"
                data:
                  push:
                    category: "{{ door.category }}"
                    sound: US-EN-Morgan-Freeman-Garage-Door-Opened.wav
      default:
        - action: notify.mobile_app_jeffsphone
          continue_on_error: true
          data: &garage_open_away
            title: "{{ door.title }}"
            message: "{{ door.title }} is open and no one is home!"
            data:
              push:
                category: "{{ door.category }}"
                sound: US-EN-Morgan-Freeman-Garage-Door-Opened.wav
        - action: notify.mobile_app_jensphone
          continue_on_error: true
          data: *garage_open_away

## Everyone leaves while a garage door is open.
- id: garage_door_open_when_leaving
  alias: 'Notify when everyone leaves and a garage door is still open'
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: zone.home
      below: 1
  variables:
    doors:
      - entity: cover.jeff_garage_door
        title: Jeff's Garage Door
        category: garage
      - entity: cover.jen_garage_door
        title: Jen's Garage Door
        category: garage2
  action:
    - repeat:
        for_each: "{{ doors }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state(repeat.item.entity, 'open') }}"
            then:
              - action: notify.mobile_app_jeffsphone
                continue_on_error: true
                data: &garage_still_open
                  title: "{{ repeat.item.title }}"
                  message: "{{ repeat.item.title }} is still open and no one is home!"
                  data:
                    push:
                      category: "{{ repeat.item.category }}"
                      sound: US-EN-Morgan-Freeman-Garage-Door-Opened.wav
              - action: notify.mobile_app_jensphone
                continue_on_error: true
                data: *garage_still_open

## A door stays open for 2 hours (weekdays only: the family leaves them open on
## weekends). Pushes to both phones, repeats every 3 hours while still open, and
## closes the door if that door's auto-close toggle is on.
- id: garage_door_open_nag
  alias: 'Nag when a garage door has been open for 2 hours'
  mode: parallel
  max: 2
  trigger:
    - platform: state
      entity_id:
        - cover.jeff_garage_door
        - cover.jen_garage_door
      to: 'open'
      for: '02:00:00'
  variables:
    doors:
      cover.jeff_garage_door:
        title: Jeff's Garage Door
        category: garage
        auto_close: input_boolean.auto_close_garage_door_jeff
      cover.jen_garage_door:
        title: Jen's Garage Door
        category: garage2
        auto_close: input_boolean.auto_close_garage_door_jen
    door: "{{ doors[trigger.entity_id] }}"
    entity: "{{ trigger.entity_id }}"
  action:
    - repeat:
        sequence:
          - if:
              - condition: time
                weekday: [mon, tue, wed, thu, fri]
            then:
              - action: notify.mobile_app_jeffsphone
                continue_on_error: true
                data: &garage_nag
                  title: "{{ door.title }}"
                  message: >
                    {{ door.title }} has remained open for about
                    {{ 2 + 3 * (repeat.index - 1) }} hours
                  data:
                    push:
                      category: "{{ door.category }}"
              - action: notify.mobile_app_jensphone
                continue_on_error: true
                data: *garage_nag
              - if:
                  - condition: template
                    value_template: "{{ is_state(door.auto_close, 'on') }}"
                then:
                  - action: cover.close_cover
                    target:
                      entity_id: "{{ entity }}"
          - wait_template: "{{ not is_state(entity, 'open') }}"
            timeout: '03:00:00'
            continue_on_timeout: true
        until:
          - condition: template
            value_template: "{{ not is_state(entity, 'open') }}"

## 10pm: close any open garage door (if the night toggle is on) and tell both phones.
## Node-RED also spoke the message with tts.google_say; that is dropped.
- id: garage_close_at_10pm
  alias: 'Close open garage doors at 10pm'
  mode: single
  trigger:
    - platform: time
      at: '22:00:00'
  condition:
    - condition: state
      entity_id: input_boolean.auto_garage_doors_night
      state: 'on'
  variables:
    doors:
      - entity: cover.jeff_garage_door
        title: Jeff's Garage Door
        category: garage
      - entity: cover.jen_garage_door
        title: Jen's Garage Door
        category: garage2
  action:
    - repeat:
        for_each: "{{ doors }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state(repeat.item.entity, 'open') }}"
            then:
              - action: notify.mobile_app_jeffsphone
                continue_on_error: true
                data: &garage_auto_close
                  title: "{{ repeat.item.title }}"
                  message: "Automatically closing {{ repeat.item.title }}"
                  data:
                    push:
                      category: "{{ repeat.item.category }}"
              - action: notify.mobile_app_jensphone
                continue_on_error: true
                data: *garage_auto_close
              - action: cover.close_cover
                target:
                  entity_id: "{{ repeat.item.entity }}"
