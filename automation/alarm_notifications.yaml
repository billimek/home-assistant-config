################################################
## Alarm notifications
################################################
## Replaces the Node-RED alarm armed / disarmed / triggered notification flows.
## Gated by the input_boolean.notify_alarm_* toggles. Sent through script.notify_phones.
## Slack is no longer used; Discord only fires for a triggered alarm.
## The only action button is Disarm (Face ID); it is handled in notification_actions.yaml.

- id: alarm_triggered_notify
  alias: 'Notify when the alarm is triggered'
  description: 'Critical push to both phones (Disarm button, tap opens Security) and a Discord message.'
  mode: single
  trigger:
    - platform: state
      entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
      to: 'triggered'
  condition:
    - condition: state
      entity_id: input_boolean.notify_alarm_triggered
      state: 'on'
  action:
    - parallel:
        - action: script.notify_phones
          data:
            title: "🚨 ALARM TRIGGERED! 🚨"
            subtitle: "{{ states('sensor.alarm_zones_active') }}"
            message: "THE ALARM HAS TRIGGERED! OMG WTFBBQ!!!!111 🔥 {{ states('sensor.alarm_panel_message') }}"
            level: critical
            icon: 'mdi:shield-alert'
            tag: alarm_triggered
            group: alarm
            url: /lovelace/security
            actions:
              - action: DISARM_ALARM
                title: Disarm
                destructive: true
                authenticationRequired: true
        - action: notify.discord
          continue_on_error: true
          data:
            message: "<@65851793686405120> 🚨 ALARM HAS TRIGGERED 🚨\n{{ trigger.to_state.state }} \n OMG WTFBBQ!!!!!11 :fire:"
            target:
              - '782247274029776937'
              - '65851793686405120'

- id: alarm_triggered_clear
  alias: 'Clear the alarm-triggered push when the alarm is disarmed'
  description: 'Removes the critical push from the phones once the alarm leaves the triggered state.'
  mode: single
  trigger:
    - platform: state
      entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
      from: 'triggered'
  action:
    - action: script.notify_clear
      data:
        tag: alarm_triggered

- id: alarm_armed_notify
  alias: 'Notify when the alarm is armed'
  description: 'Passive (summary-only) push with a Disarm button; replaces the previous alarm status push. Skipped while timer.alarm_auto_disarm is running (automatic arm/disarm).'
  mode: queued
  trigger:
    - platform: state
      entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
      to:
        - armed_away
        - armed_home
        - armed_night
        - armed_vacation
        - armed_custom_bypass
  condition:
    - condition: state
      entity_id: input_boolean.notify_alarm_armed
      state: 'on'
    - condition: state
      entity_id: timer.alarm_auto_disarm
      state: 'idle'
  variables:
    modes:
      armed_away: Away
      armed_home: Home
      armed_night: Night
      armed_vacation: Vacation
      armed_custom_bypass: Custom bypass
  action:
    - action: script.notify_phones
      data:
        title: "🔒 Alarm armed"
        message: "Armed – {{ modes.get(trigger.to_state.state, trigger.to_state.state) }}"
        level: passive
        icon: 'mdi:shield-lock'
        tag: alarm_status
        group: alarm
        url: /lovelace/security
        actions:
          - action: DISARM_ALARM
            title: Disarm
            authenticationRequired: true

- id: alarm_disarmed_notify
  alias: 'Notify when the alarm is disarmed'
  description: 'Passive push that replaces the "armed" push. Skipped while timer.alarm_auto_disarm is running (automatic arm/disarm).'
  mode: queued
  trigger:
    - platform: state
      entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
      to: 'disarmed'
  condition:
    - condition: state
      entity_id: input_boolean.notify_alarm_disarmed
      state: 'on'
    - condition: state
      entity_id: timer.alarm_auto_disarm
      state: 'idle'
  action:
    - action: script.notify_phones
      data:
        title: "🔓 Alarm disarmed"
        message: "Disarmed at {{ now().strftime('%-I:%M %p') }}"
        level: passive
        icon: 'mdi:shield-off'
        tag: alarm_status
        group: alarm
        url: /lovelace/security

- id: alarm_suspicious_disarm_notify
  alias: 'Notify when the alarm is disarmed between midnight and 5am'
  description: 'Time-sensitive push to Jeff only.'
  mode: queued
  trigger:
    - platform: state
      entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
      to: 'disarmed'
  condition:
    - condition: time
      after: '00:00:00'
      before: '05:00:00'
  action:
    - action: script.notify_phones
      data:
        audience: jeff
        title: "Suspicious activity"
        message: "Someone disarmed the alarm at {{ now().strftime('%-I:%M %p on %m/%d') }}"
        level: time-sensitive
        tag: alarm_suspicious
        group: alarm
        url: /lovelace/security

- id: alarm_disarmed_while_away_notify
  alias: 'Notify when the alarm is disarmed while nobody is home'
  description: 'Time-sensitive push to Jeff only. Skipped for automatic disarms (timer.alarm_auto_disarm).'
  mode: queued
  trigger:
    - platform: state
      entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
      to: 'disarmed'
  condition:
    - condition: numeric_state
      entity_id: zone.home
      below: 1
    - condition: state
      entity_id: timer.alarm_auto_disarm
      state: 'idle'
  action:
    - action: script.notify_phones
      data:
        audience: jeff
        title: "Alarm disarmed while away"
        message: "Someone disarmed the alarm at {{ now().strftime('%-I:%M %p on %m/%d') }} and nobody is home"
        level: time-sensitive
        icon: 'mdi:shield-off'
        tag: alarm_disarmed_away
        group: alarm
        url: /lovelace/security
