################################################
## Alarm arm / disarm logic
################################################
## Replaces the Node-RED Alarm tab arm/disarm flows. Notifications for the
## resulting state changes live in alarm_notifications.yaml.
## The cleaning-calendar checks from Node-RED are dropped (the calendar feed is
## gone); revisit when an iCloud calendar integration exists.

## Two switches: input_boolean.auto_alarm_presence (arm when the last person leaves,
## disarm when the first arrives) and input_boolean.auto_arm_disarm_alarm_night
## (midnight arm, 05:00 disarm).
## Guest mode (input_boolean.guest_mode) blocks both automatic arms (midnight and
## everyone-leaves) so guests never deal with the alarm; disarming is unaffected.

## Midnight: turn the lights off, then arm the alarm if the night toggle is on.
- id: alarm_midnight
  alias: 'Midnight lights off and arm alarm'
  description: 'At midnight runs script.lights_off, then arms the alarm (home) if input_boolean.auto_arm_disarm_alarm_night is on and it is disarmed.'
  mode: single
  trigger:
    - platform: time
      at: '00:00:00'
  action:
    - action: script.lights_off
    - if:
        - condition: state
          entity_id: input_boolean.auto_arm_disarm_alarm_night
          state: 'on'
        - condition: state
          entity_id: input_boolean.guest_mode
          state: 'off'
        - condition: state
          entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
          state: 'disarmed'
      then:
        - action: alarm_control_panel.alarm_arm_home
          target:
            entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
          data:
            code: !env_var ALARMCD

## 05:00: disarm if the night toggle is on and the alarm is not already disarmed.
- id: alarm_morning_disarm
  alias: 'Disarm alarm at 5am'
  description: 'At 05:00 disarms the alarm if input_boolean.auto_arm_disarm_alarm_night is on and it is armed. Starts timer.alarm_auto_disarm so the "disarmed" push is skipped.'
  mode: single
  trigger:
    - platform: time
      at: '05:00:00'
  condition:
    - condition: state
      entity_id: input_boolean.auto_arm_disarm_alarm_night
      state: 'on'
    - condition: not
      conditions:
        - condition: state
          entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
          state: 'disarmed'
  action:
    - action: timer.start
      target:
        entity_id: timer.alarm_auto_disarm
    - action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
      data:
        code: !env_var ALARMCD

## Someone arrives home (zone.home goes from 0 to more than 0): disarm.
- id: alarm_disarm_on_arrival
  alias: 'Disarm alarm when someone arrives home'
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: zone.home
      above: 0
  condition:
    - condition: state
      entity_id: input_boolean.auto_alarm_presence
      state: 'on'
    - condition: not
      conditions:
        - condition: state
          entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
          state: 'disarmed'
  action:
    - action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
      data:
        code: !env_var ALARMCD

## Everyone leaves (zone.home drops to 0): arm. Node-RED only did this outside
## 06:31-14:00 to avoid arming when the cleaners were due; now it arms at any hour.
## Guest mode skips the arm, with a passive push so a missed arm is explained.
- id: alarm_arm_on_leave
  alias: 'Arm alarm when everyone leaves'
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: zone.home
      below: 1
  condition:
    - condition: state
      entity_id: input_boolean.auto_alarm_presence
      state: 'on'
    - condition: state
      entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
      state: 'disarmed'
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.guest_mode
              state: 'on'
          sequence:
            - action: script.notify_phones
              data:
                audience: jeff
                title: "Alarm not armed"
                message: "Everyone left, but guest mode is on so the alarm was not armed."
                level: passive
                tag: alarm_not_armed
                group: alarm
                url: /lovelace/security
      default:
        - action: alarm_control_panel.alarm_arm_home
          target:
            entity_id: alarm_control_panel.ser2sock_10000_alarm_panel
          data:
            code: !env_var ALARMCD
