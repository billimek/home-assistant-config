## Theme for the redesigned "Home" dashboard (dashboard url: home-new).
## Palette comes from the Claude Design mockup: one color per function
## (amber garage/lights, violet cameras, blue alarm, green presence, cyan climate).
home_new:
  modes:
    dark:
      primary-color: "#6db3ff"
      accent-color: "#ffb84d"
      primary-background-color: "#0e1318"
      secondary-background-color: "#0e1318"
      card-background-color: "#18202a"
      ha-card-background: "#18202a"
      ha-card-border-radius: "22px"
      ha-card-border-width: "1px"
      ha-card-border-color: "#2a3542"
      ha-card-box-shadow: "none"
      primary-text-color: "#eef2f6"
      secondary-text-color: "#9aa8b8"
      divider-color: "#2a3542"
      app-header-background-color: "#0e1318"
      app-header-text-color: "#eef2f6"
      state-icon-color: "#9aa8b8"
      state-active-color: "#ffb84d"
      tile-background-color: "#18202a"
      # larger, bolder text like the mockup (HA font tokens used by tiles and headings)
      ha-font-size-s: "13px"
      ha-font-size-m: "16px"
      ha-font-size-l: "18px"
      ha-font-size-xl: "22px"
      ha-font-weight-medium: "600"
      ha-font-weight-bold: "700"
      # one color per function
      red-color: "#ff7a8a"
      amber-color: "#ffb84d"
      green-color: "#4fd1a0"
      blue-color: "#6db3ff"
      cyan-color: "#6fd3f2"
      purple-color: "#b49cff"
    light:
      primary-color: "#0f5fb5"
      accent-color: "#8a5200"
      primary-background-color: "#f2f4f7"
      secondary-background-color: "#f2f4f7"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      ha-card-border-radius: "22px"
      ha-card-border-width: "1px"
      ha-card-border-color: "#d9dfe7"
      ha-card-box-shadow: "none"
      primary-text-color: "#111a24"
      secondary-text-color: "#566475"
      divider-color: "#d9dfe7"
      app-header-background-color: "#f2f4f7"
      app-header-text-color: "#111a24"
      state-icon-color: "#566475"
      state-active-color: "#8a5200"
      tile-background-color: "#ffffff"
      ha-font-size-s: "13px"
      ha-font-size-m: "16px"
      ha-font-size-l: "18px"
      ha-font-size-xl: "22px"
      ha-font-weight-medium: "600"
      ha-font-weight-bold: "700"
      red-color: "#c53757"
      amber-color: "#b7770c"
      green-color: "#0b6b4b"
      blue-color: "#0f5fb5"
      cyan-color: "#1683c7"
      purple-color: "#5b3fc4"
