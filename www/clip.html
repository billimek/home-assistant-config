<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frigate clip</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; font: 16px sans-serif; color: #ccc; }
  video { width: 100%; max-height: 100%; }
</style>
</head>
<body>
<video id="v" controls autoplay muted playsinline></video>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
  // Plays a Frigate event clip (HLS) from the /api/frigate proxy: ?src=/api/frigate/notifications/<id>/<camera>/master.m3u8
  // Safari plays HLS natively; other browsers go through hls.js.
  var v = document.getElementById('v');
  var src = new URLSearchParams(location.search).get('src') || '';
  if (src.indexOf('/api/frigate/notifications/') !== 0) {
    document.body.textContent = 'No clip';
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = src;
  } else if (window.Hls && Hls.isSupported()) {
    var h = new Hls();
    h.loadSource(src);
    h.attachMedia(v);
  } else {
    document.body.textContent = 'This browser cannot play the clip';
  }
</script>
</body>
</html>
