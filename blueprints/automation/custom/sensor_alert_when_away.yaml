blueprint:
  name: Sensor Alert When Away
  description: >
    Push (via script.notify_phones) when a sensor (door/window/motion) is triggered and nobody
    is home. The push has a "Snooze 1 h" button, which starts timer.snooze_<key> (key = the part
    of the sensor id after ser2sock_10000_); the alert is skipped while that timer is active and
    the push is removed when the sensor closes/clears.
  domain: automation
  input:
    sensor_entity:
      name: Sensor Entity
      description: The binary sensor to monitor (door, window, or motion sensor)
      selector:
        entity:
          filter:
            - domain: binary_sensor
    sensor_name:
      name: Sensor Friendly Name
      description: Human-readable name for the sensor (e.g., "Front door", "Kitchen Window")
      selector:
        text:
    presence_sensor:
      name: Presence Sensor
      description: Sensor that tracks if anyone is home
      default: sensor.anyone_home
      selector:
        entity:
          filter:
            - domain: sensor
    audience:
      name: Who gets the push
      description: all, jeff or jen
      default: jeff
      selector:
        select:
          options:
            - all
            - jeff
            - jen

trigger:
  - platform: state
    entity_id: !input sensor_entity
    from: 'off'
    to: 'on'
    id: opened
  - platform: state
    entity_id: !input sensor_entity
    from: 'on'
    to: 'off'
    id: closed

action:
  - variables:
      sensor_name: !input sensor_name
      presence_sensor: !input presence_sensor
      audience: !input audience
      key: "{{ trigger.entity_id.split('ser2sock_10000_')[-1] }}"
      motion: "{{ state_attr(trigger.entity_id, 'device_class') == 'motion' }}"
  - choose:
      - conditions:
          - condition: trigger
            id: opened
          - condition: template
            value_template: "{{ is_state(presence_sensor, 'not_home') }}"
          # a missing timer is 'unknown', so it never blocks an alert
          - condition: template
            value_template: "{{ not is_state('timer.snooze_' ~ key, 'active') }}"
        sequence:
          - action: script.notify_phones
            data:
              audience: "{{ audience }}"
              title: "{{ 'Motion detected' if motion else sensor_name ~ ' opened' }}"
              message: >-
                {{ sensor_name }}{{ '' if motion else ' opened' }} while nobody is home.
              level: time-sensitive
              tag: "sensor_{{ key }}"
              group: security
              url: /lovelace/security
              actions:
                - action: "SENSOR_SNOOZE|{{ key }}|60"
                  title: Snooze 1 h
      - conditions:
          - condition: trigger
            id: closed
        sequence:
          - action: script.notify_clear
            data:
              tag: "sensor_{{ key }}"
