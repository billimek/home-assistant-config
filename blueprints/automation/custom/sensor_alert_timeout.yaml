blueprint:
  name: Sensor Alert Timeout
  description: >
    Push (via script.notify_phones) when a sensor (door/window) stays open for too long. The push
    has a "Snooze 1 h" button, which starts timer.snooze_<key> (key = the part of the sensor id
    after ser2sock_10000_); the alert is skipped while that timer is active and the push is
    removed when the sensor closes. With climate_entity and weather_entity set, the alert only
    fires while the open sensor is costing HVAC: the thermostat is cooling or heating, or the
    outdoor temperature is within margin_degrees of (or beyond) the thermostat setpoint.
  domain: automation
  input:
    sensor_entity:
      name: Sensor Entity
      description: The binary sensor to monitor (door or window sensor)
      selector:
        entity:
          filter:
            - domain: binary_sensor
    sensor_name:
      name: Sensor Friendly Name
      description: Human-readable name for the sensor (e.g., "Door to garage", "Basement door")
      selector:
        text:
    timeout_seconds:
      name: Timeout Duration
      description: How long the sensor can stay open before alerting (in seconds)
      default: 300
      selector:
        number:
          min: 60
          max: 3600
          unit_of_measurement: seconds
    climate_entity:
      name: Thermostat (optional)
      description: Leave empty to alert on time alone
      default: ''
      selector:
        entity:
          filter:
            - domain: climate
    weather_entity:
      name: Outdoor weather (optional)
      description: Weather entity whose temperature attribute is the outdoor temperature
      default: ''
      selector:
        entity:
          filter:
            - domain: weather
    margin_degrees:
      name: Margin
      description: Alert when outdoor temperature is within this many degrees of the setpoint, or past it
      default: 3
      selector:
        number:
          min: 0
          max: 20
    notify_jeff:
      name: Notify Jeff
      description: Send notification to Jeff's phone
      default: true
      selector:
        boolean:
    notify_jen:
      name: Notify Jen
      description: Send notification to Jen's phone
      default: true
      selector:
        boolean:

trigger_variables:
  sensor: !input sensor_entity
  climate: !input climate_entity
  weather: !input weather_entity
  margin: !input margin_degrees

trigger:
  - platform: template
    value_template: >-
      {% if not is_state(sensor, 'on') %}
        false
      {% elif climate == '' %}
        true
      {% else %}
        {% set mode = states(climate) %}
        {% set sp = state_attr(climate, 'temperature') %}
        {% set hi = state_attr(climate, 'target_temp_high') %}
        {% set lo = state_attr(climate, 'target_temp_low') %}
        {% set out = state_attr(weather, 'temperature') %}
        {% if state_attr(climate, 'hvac_action') in ['cooling', 'heating'] or out is not number %}
          true
        {% elif mode == 'cool' and sp is number %}
          {{ out > sp - margin }}
        {% elif mode == 'heat' and sp is number %}
          {{ out < sp + margin }}
        {% elif mode == 'heat_cool' and hi is number and lo is number %}
          {{ out > hi - margin or out < lo + margin }}
        {% else %}
          {{ out < 50 or out > 78 }}
        {% endif %}
      {% endif %}
    for:
      seconds: !input timeout_seconds
    id: too_long
  - platform: state
    entity_id: !input sensor_entity
    from: 'on'
    to: 'off'
    id: closed

action:
  - variables:
      sensor_name: !input sensor_name
      timeout_seconds: !input timeout_seconds
      notify_jeff: !input notify_jeff
      notify_jen: !input notify_jen
      key: "{{ sensor.split('ser2sock_10000_')[-1] }}"
      audience: >-
        {{ 'all' if notify_jeff and notify_jen else 'jeff' if notify_jeff else 'jen' if notify_jen else 'none' }}
  - choose:
      - conditions:
          - condition: trigger
            id: too_long
          - condition: template
            value_template: "{{ audience != 'none' }}"
          # a missing timer is 'unknown', so it never blocks an alert
          - condition: template
            value_template: "{{ not is_state('timer.snooze_' ~ key, 'active') }}"
        sequence:
          - action: script.notify_phones
            data:
              audience: "{{ audience }}"
              title: "{{ '🪟 ' if 'window' in key else '🚪 ' }}{{ sensor_name }} left open"
              message: "{{ sensor_name }} has been open for more than {{ (timeout_seconds / 60) | int }} minutes."
              level: time-sensitive
              icon: 'mdi:door-open'
              tag: "sensor_{{ key }}"
              group: security
              url: /lovelace/security
              actions:
                - action: "SENSOR_SNOOZE|{{ key }}|60"
                  title: Snooze 1 h
      - conditions:
          - condition: trigger
            id: closed
        sequence:
          - action: script.notify_clear
            data:
              tag: "sensor_{{ key }}"
