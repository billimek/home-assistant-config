blueprint:
  name: Sensor Alert Timeout
  description: >
    Push (via script.notify_phones) when a sensor (door/window) stays open for too long. The push
    has a "Snooze 1 h" button, which starts timer.snooze_<key> (key = the part of the sensor id
    after ser2sock_10000_); the alert is skipped while that timer is active and the push is
    removed when the sensor closes.
  domain: automation
  input:
    sensor_entity:
      name: Sensor Entity
      description: The binary sensor to monitor (door or window sensor)
      selector:
        entity:
          filter:
            - domain: binary_sensor
    sensor_name:
      name: Sensor Friendly Name
      description: Human-readable name for the sensor (e.g., "Door to garage", "Basement door")
      selector:
        text:
    timeout_seconds:
      name: Timeout Duration
      description: How long the sensor can stay open before alerting (in seconds)
      default: 300
      selector:
        number:
          min: 60
          max: 3600
          unit_of_measurement: seconds
    notify_jeff:
      name: Notify Jeff
      description: Send notification to Jeff's phone
      default: true
      selector:
        boolean:
    notify_jen:
      name: Notify Jen
      description: Send notification to Jen's phone
      default: true
      selector:
        boolean:

trigger:
  - platform: state
    entity_id: !input sensor_entity
    from: 'off'
    to: 'on'
    for:
      seconds: !input timeout_seconds
    id: too_long
  - platform: state
    entity_id: !input sensor_entity
    from: 'on'
    to: 'off'
    id: closed

action:
  - variables:
      sensor_name: !input sensor_name
      timeout_seconds: !input timeout_seconds
      notify_jeff: !input notify_jeff
      notify_jen: !input notify_jen
      key: "{{ trigger.entity_id.split('ser2sock_10000_')[-1] }}"
      audience: >-
        {{ 'all' if notify_jeff and notify_jen else 'jeff' if notify_jeff else 'jen' if notify_jen else 'none' }}
  - choose:
      - conditions:
          - condition: trigger
            id: too_long
          - condition: template
            value_template: "{{ audience != 'none' }}"
          # a missing timer is 'unknown', so it never blocks an alert
          - condition: template
            value_template: "{{ not is_state('timer.snooze_' ~ key, 'active') }}"
        sequence:
          - action: script.notify_phones
            data:
              audience: "{{ audience }}"
              title: "{{ sensor_name }} left open"
              message: "{{ sensor_name }} has been open for more than {{ (timeout_seconds / 60) | int }} minutes."
              level: time-sensitive
              icon: 'mdi:door-open'
              tag: "sensor_{{ key }}"
              group: security
              url: /lovelace/security
              actions:
                - action: "SENSOR_SNOOZE|{{ key }}|60"
                  title: Snooze 1 h
      - conditions:
          - condition: trigger
            id: closed
        sequence:
          - action: script.notify_clear
            data:
              tag: "sensor_{{ key }}"
