## Alarm panel
- sensor:
  - name: "Alarm Status"
    unique_id: alarm_status
    availability: "{{ states('alarm_control_panel.ser2sock_10000_alarm_panel') not in ['unknown', 'unavailable'] }}"
    state: "{{ 'Armed' if states('alarm_control_panel.ser2sock_10000_alarm_panel').startswith('armed') else 'Disarmed' }}"

  # Friendly version of the keypad line ("FAULT 17        UPSTAIRS MOTION", "****DISARMED****  Ready to Arm")
  # for the dashboard. Unrecognised messages pass through with the padding/asterisks removed.
  - name: "Alarm Panel Message"
    unique_id: alarm_panel_message
    state: >
      {% set d = states('sensor.ser2sock_10000_alarm_panel_display') | regex_replace('\s+', ' ') | trim %}
      {% if d in ['', 'unknown', 'unavailable'] %}
        Unknown
      {% elif 'READY TO ARM' in d | upper %}
        Ready to arm
      {% elif 'HIT * FOR FAULTS' in d | upper %}
        Not ready, faults open
      {% elif d | regex_match('^FAULT [0-9]+ ', ignorecase=true) %}
        {% set p = d.split(' ', 2) %}
        Open: {{ p[2] | lower | capitalize }} (zone {{ p[1] }})
      {% elif 'MAY EXIT NOW' in d | upper %}
        Exit now
      {% else %}
        {{ d | replace('*', ' ') | regex_replace('\s+', ' ') | trim }}
      {% endif %}

  # What is open or tripped right now, for the dashboard (Home status pill and Security tab)
  - name: "Alarm Zones Active"
    unique_id: alarm_zones_active
    state: >
      {% set z = states.binary_sensor | selectattr('entity_id', 'search', '^binary_sensor\.ser2sock_10000_') | rejectattr('entity_id', 'eq', 'binary_sensor.ser2sock_10000_basement_window') | selectattr('state', 'eq', 'on') | list %}
      {% set motion = z | selectattr('attributes.device_class', 'eq', 'motion') | map(attribute='name') | list %}
      {% set opened = z | selectattr('attributes.device_class', 'in', ['door', 'window']) | map(attribute='name') | list %}
      {% set smoke = z | selectattr('attributes.device_class', 'eq', 'smoke') | map(attribute='name') | list %}
      {% set parts = [] %}
      {% if smoke %}{% set parts = parts + ['Smoke: ' ~ smoke | join(', ')] %}{% endif %}
      {% if opened %}{% set parts = parts + ['Open: ' ~ opened | join(', ')] %}{% endif %}
      {% if motion %}{% set parts = parts + ['Motion: ' ~ motion | join(', ')] %}{% endif %}
      {{ parts | join(' · ') if parts else 'All zones closed' }}
    attributes:
      active: >
        {{ states.binary_sensor | selectattr('entity_id', 'search', '^binary_sensor\.ser2sock_10000_') | rejectattr('entity_id', 'eq', 'binary_sensor.ser2sock_10000_basement_window') | selectattr('state', 'eq', 'on') | list | count }}

## Weekday
- sensor:
  - name: "Weekday"
    unique_id: weekday
    state: "{{ now().weekday() < 5 }}"


## Tire pressure alert per car (any of the four TeslaMate soft-tire sensors)
- binary_sensor:
  - name: "KARR Tire Alert"
    unique_id: karr_tire_alert
    device_class: problem
    state: >
      {{ expand('binary_sensor.karr_tire_soft_front_left', 'binary_sensor.karr_tire_soft_front_right',
                'binary_sensor.karr_tire_soft_rear_left', 'binary_sensor.karr_tire_soft_rear_right')
         | selectattr('state', 'eq', 'on') | list | count > 0 }}
  - name: "Orion Tire Alert"
    unique_id: orion_tire_alert
    device_class: problem
    state: >
      {{ expand('binary_sensor.orion_tire_soft_front_left', 'binary_sensor.orion_tire_soft_front_right',
                'binary_sensor.orion_tire_soft_rear_left', 'binary_sensor.orion_tire_soft_rear_right')
         | selectattr('state', 'eq', 'on') | list | count > 0 }}
  - name: "Elektra Tire Alert"
    unique_id: elektra_tire_alert
    device_class: problem
    state: >
      {{ expand('binary_sensor.elektra_tire_soft_front_left', 'binary_sensor.elektra_tire_soft_front_right',
                'binary_sensor.elektra_tire_soft_rear_left', 'binary_sensor.elektra_tire_soft_rear_right')
         | selectattr('state', 'eq', 'on') | list | count > 0 }}

## Forecast-driven sensors, from the Tempest's own forecast (weather.unknown, named "🦖"; it has
## rain probability and 10 days, and matched other weather apps better than the Ecobee one).
## Trigger-based because the forecast is an action response, which no template helper can read.
## Fire event refresh_forecast_sensors to update them on demand.
##  - Forecast Low: coldest forecast low of today + tomorrow; feeds the freeze warning push
##    (automation/home_health.yaml), the Weather tab and the Home tab
##  - Next Rain: first day with a 50 % or better chance of rain
- triggers:
    - trigger: time_pattern
      minutes: '/30'
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: refresh_forecast_sensors
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: weather.unknown
      data:
        type: daily
      response_variable: daily
  sensor:
    - name: "Forecast Low (2 nights)"
      unique_id: forecast_low_2_nights
      unit_of_measurement: "°F"
      device_class: temperature
      state: >
        {% set f = (daily['weather.unknown'].forecast | default([]))[:2] %}
        {{ f | map(attribute='templow') | map('float', 100) | min if f else none }}

    - name: "Next Rain"
      unique_id: next_rain
      icon: mdi:weather-rainy
      state: >
        {% set days = daily['weather.unknown'].forecast | default([]) | selectattr('precipitation_probability', 'number') | selectattr('precipitation_probability', 'ge', 50) | list %}
        {% if not days %}
          None in the next 10 days
        {% else %}
          {% set d = (days[0].datetime | as_datetime | as_local).date() %}
          {% set delta = (d - now().date()).days %}
          {{ 'Today' if delta <= 0 else 'Tomorrow' if delta == 1 else d.strftime('%A') }} · {{ days[0].precipitation_probability | int }}%
        {% endif %}
      attributes:
        condition: >
          {% set days = daily['weather.unknown'].forecast | default([]) | selectattr('precipitation_probability', 'number') | selectattr('precipitation_probability', 'ge', 50) | list %}
          {{ days[0].condition if days else none }}

## EV charging cost this month: the monthly utility meters (UI helpers on each car's TeslaMate
## sensor.<car>_energy_added) x the rate in input_number.ev_electricity_rate (an effective $/kWh into the battery, so it already includes the charging loss).
- sensor:
  - name: "KARR Charging Cost Month"
    unique_id: karr_charging_cost_month
    unit_of_measurement: "$"
    icon: mdi:ev-station
    state: "{{ (states('sensor.karr_charging_energy_month') | float(0) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
    attributes:
      energy_kwh: "{{ states('sensor.karr_charging_energy_month') | float(0) | round(1) }}"
      last_month: "{{ (state_attr('sensor.karr_charging_energy_month', 'last_period') | float(0) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
  - name: "Orion Charging Cost Month"
    unique_id: orion_charging_cost_month
    unit_of_measurement: "$"
    icon: mdi:ev-station
    state: "{{ (states('sensor.orion_charging_energy_month') | float(0) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
    attributes:
      energy_kwh: "{{ states('sensor.orion_charging_energy_month') | float(0) | round(1) }}"
      last_month: "{{ (state_attr('sensor.orion_charging_energy_month', 'last_period') | float(0) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
  - name: "Elektra Charging Cost Month"
    unique_id: elektra_charging_cost_month
    unit_of_measurement: "$"
    icon: mdi:ev-station
    state: "{{ (states('sensor.elektra_charging_energy_month') | float(0) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
    attributes:
      energy_kwh: "{{ states('sensor.elektra_charging_energy_month') | float(0) | round(1) }}"
      last_month: "{{ (state_attr('sensor.elektra_charging_energy_month', 'last_period') | float(0) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
  - name: "EV Charging Cost Month"
    unique_id: ev_charging_cost_month
    unit_of_measurement: "$"
    icon: mdi:ev-station
    state: "{{ (states('sensor.karr_charging_cost_month') | float(0) + states('sensor.orion_charging_cost_month') | float(0) + states('sensor.elektra_charging_cost_month') | float(0)) | round(2) }}"
    attributes:
      last_month: "{{ (state_attr('sensor.karr_charging_cost_month', 'last_month') | float(0) + state_attr('sensor.orion_charging_cost_month', 'last_month') | float(0) + state_attr('sensor.elektra_charging_cost_month', 'last_month') | float(0)) | round(2) }}"

## Things that need a human (low batteries, toner, fridge door, unplugged cars, tires, stale backup).
## The list lives in custom_templates/attention.jinja; the Home dashboard shows its "Needs attention"
## section only while this count is above 0.
- sensor:
  - name: "Attention Items"
    unique_id: attention_items
    icon: mdi:alert-circle-outline
    state: "{% from 'attention.jinja' import collect %}{{ collect() | from_json | count }}"
    attributes:
      items: "{% from 'attention.jinja' import collect %}{{ collect() | from_json }}"

## Last person Frigate would have alerted on, per camera (Cameras tab, "Last person seen").
## Mirrors the camera push rule: a Frigate review with severity alert whose objects include a
## person. image.<cam>_person shows every person snapshot, including low-score ones that never
## alert. State = review start time; review_id is Frigate's event id, which the dashboard uses
## for the full snapshot (tap) and the HLS clip (hold) through the /api/frigate proxy.
- triggers:
    - trigger: mqtt
      topic: frigate/reviews
  conditions:
    - condition: template
      value_template: >
        {% set a = trigger.payload_json.after %}
        {{ trigger.payload_json.type in ['new', 'update', 'end'] and a.severity == 'alert'
           and (a.data.objects | map('regex_replace', '-verified$', '') | select('eq', 'person') | list | count > 0)
           and a.data.detections | count > 0 }}
  sensor:
    - name: "Doorbell Last Alert Person"
      unique_id: doorbell_last_alert_person
      device_class: timestamp
      icon: mdi:account-eye
      state: >
        {% set a = trigger.payload_json.after %}
        {% if a.camera == 'doorbell' %}{{ a.start_time | float(0) | timestamp_custom('%Y-%m-%dT%H:%M:%S+00:00', false) }}{% else %}{{ this.state if this.state | as_datetime(none) else none }}{% endif %}
      attributes:
        review_id: >
          {% set a = trigger.payload_json.after %}
          {% if a.camera == 'doorbell' %}{{ a.data.detections[0] }}{% else %}{{ this.attributes.get('review_id', none) }}{% endif %}
    - name: "Front Last Alert Person"
      unique_id: front_last_alert_person
      device_class: timestamp
      icon: mdi:account-eye
      state: >
        {% set a = trigger.payload_json.after %}
        {% if a.camera == 'front' %}{{ a.start_time | float(0) | timestamp_custom('%Y-%m-%dT%H:%M:%S+00:00', false) }}{% else %}{{ this.state if this.state | as_datetime(none) else none }}{% endif %}
      attributes:
        review_id: >
          {% set a = trigger.payload_json.after %}
          {% if a.camera == 'front' %}{{ a.data.detections[0] }}{% else %}{{ this.attributes.get('review_id', none) }}{% endif %}
    - name: "Driveway Last Alert Person"
      unique_id: driveway_last_alert_person
      device_class: timestamp
      icon: mdi:account-eye
      state: >
        {% set a = trigger.payload_json.after %}
        {% if a.camera == 'driveway' %}{{ a.start_time | float(0) | timestamp_custom('%Y-%m-%dT%H:%M:%S+00:00', false) }}{% else %}{{ this.state if this.state | as_datetime(none) else none }}{% endif %}
      attributes:
        review_id: >
          {% set a = trigger.payload_json.after %}
          {% if a.camera == 'driveway' %}{{ a.data.detections[0] }}{% else %}{{ this.attributes.get('review_id', none) }}{% endif %}
    - name: "Porch Last Alert Person"
      unique_id: porch_last_alert_person
      device_class: timestamp
      icon: mdi:account-eye
      state: >
        {% set a = trigger.payload_json.after %}
        {% if a.camera == 'porch' %}{{ a.start_time | float(0) | timestamp_custom('%Y-%m-%dT%H:%M:%S+00:00', false) }}{% else %}{{ this.state if this.state | as_datetime(none) else none }}{% endif %}
