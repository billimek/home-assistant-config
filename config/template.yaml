## Alarm panel
- sensor:
  - name: "Alarm Status"
    unique_id: alarm_status
    availability: "{{ states('alarm_control_panel.ser2sock_10000_alarm_panel') not in ['unknown', 'unavailable'] }}"
    state: "{{ 'Armed' if states('alarm_control_panel.ser2sock_10000_alarm_panel').startswith('armed') else 'Disarmed' }}"

  # Friendly version of the keypad line ("FAULT 17        UPSTAIRS MOTION", "****DISARMED****  Ready to Arm")
  # for the dashboard. Unrecognised messages pass through with the padding/asterisks removed.
  - name: "Alarm Panel Message"
    unique_id: alarm_panel_message
    state: >
      {% set d = states('sensor.ser2sock_10000_alarm_panel_display') | regex_replace('\s+', ' ') | trim %}
      {% if d in ['', 'unknown', 'unavailable'] %}
        Unknown
      {% elif 'READY TO ARM' in d | upper %}
        Ready to arm
      {% elif 'HIT * FOR FAULTS' in d | upper %}
        Not ready, faults open
      {% elif d | regex_match('^FAULT [0-9]+ ', ignorecase=true) %}
        {% set p = d.split(' ', 2) %}
        Open: {{ p[2] | lower | capitalize }} (zone {{ p[1] }})
      {% elif 'MAY EXIT NOW' in d | upper %}
        Exit now
      {% else %}
        {{ d | replace('*', ' ') | regex_replace('\s+', ' ') | trim }}
      {% endif %}

  # What is open or tripped right now, for the dashboard (Home status pill and Security tab)
  - name: "Alarm Zones Active"
    unique_id: alarm_zones_active
    state: >
      {% set z = states.binary_sensor | selectattr('entity_id', 'search', '^binary_sensor\.ser2sock_10000_') | rejectattr('entity_id', 'eq', 'binary_sensor.ser2sock_10000_basement_window') | selectattr('state', 'eq', 'on') | list %}
      {% set motion = z | selectattr('attributes.device_class', 'eq', 'motion') | map(attribute='name') | list %}
      {% set opened = z | selectattr('attributes.device_class', 'in', ['door', 'window']) | map(attribute='name') | list %}
      {% set smoke = z | selectattr('attributes.device_class', 'eq', 'smoke') | map(attribute='name') | list %}
      {% set parts = [] %}
      {% if smoke %}{% set parts = parts + ['Smoke: ' ~ smoke | join(', ')] %}{% endif %}
      {% if opened %}{% set parts = parts + ['Open: ' ~ opened | join(', ')] %}{% endif %}
      {% if motion %}{% set parts = parts + ['Motion: ' ~ motion | join(', ')] %}{% endif %}
      {{ parts | join(' · ') if parts else 'All zones closed' }}
    attributes:
      active: >
        {{ states.binary_sensor | selectattr('entity_id', 'search', '^binary_sensor\.ser2sock_10000_') | rejectattr('entity_id', 'eq', 'binary_sensor.ser2sock_10000_basement_window') | selectattr('state', 'eq', 'on') | list | count }}

## Weekday
- sensor:
  - name: "Weekday"
    unique_id: weekday
    state: "{{ now().weekday() < 5 }}"


## Tire pressure alert per car (any of the four TeslaMate soft-tire sensors)
- binary_sensor:
  - name: "KARR Tire Alert"
    unique_id: karr_tire_alert
    device_class: problem
    state: >
      {{ expand('binary_sensor.karr_tire_soft_front_left', 'binary_sensor.karr_tire_soft_front_right',
                'binary_sensor.karr_tire_soft_rear_left', 'binary_sensor.karr_tire_soft_rear_right')
         | selectattr('state', 'eq', 'on') | list | count > 0 }}
  - name: "Orion Tire Alert"
    unique_id: orion_tire_alert
    device_class: problem
    state: >
      {{ expand('binary_sensor.orion_tire_soft_front_left', 'binary_sensor.orion_tire_soft_front_right',
                'binary_sensor.orion_tire_soft_rear_left', 'binary_sensor.orion_tire_soft_rear_right')
         | selectattr('state', 'eq', 'on') | list | count > 0 }}
  - name: "Elektra Tire Alert"
    unique_id: elektra_tire_alert
    device_class: problem
    state: >
      {{ expand('binary_sensor.elektra_tire_soft_front_left', 'binary_sensor.elektra_tire_soft_front_right',
                'binary_sensor.elektra_tire_soft_rear_left', 'binary_sensor.elektra_tire_soft_rear_right')
         | selectattr('state', 'eq', 'on') | list | count > 0 }}

## Coldest forecast low over the next two nights (Ecobee daily forecast). Feeds the freeze
## warning push (automation/home_health.yaml) and the Weather tab. Trigger-based because the
## forecast is an action response, which no template helper can read.
- triggers:
    - trigger: time_pattern
      minutes: '/30'
    - trigger: homeassistant
      event: start
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: weather.upstairs
      data:
        type: daily
      response_variable: daily
  sensor:
    - name: "Forecast Low (2 nights)"
      unique_id: forecast_low_2_nights
      unit_of_measurement: "°F"
      device_class: temperature
      state: >
        {% set f = (daily['weather.upstairs'].forecast | default([]))[:2] %}
        {{ f | map(attribute='templow') | map('float', 100) | min if f else none }}

    - name: "Next Rain"
      unique_id: next_rain
      icon: mdi:weather-rainy
      state: >
        {% set rain = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'] %}
        {% set hit = (daily['weather.upstairs'].forecast | default([])) | selectattr('condition', 'in', rain) | first | default(none) %}
        {% if hit is none %}
          None in the next 5 days
        {% else %}
          {% set d = (hit.datetime | as_datetime | as_local).date() %}
          {% set delta = (d - now().date()).days %}
          {{ 'Today' if delta <= 0 else 'Tomorrow' if delta == 1 else d.strftime('%A') }}
        {% endif %}

## EV charging cost this month: the monthly utility meters (UI helpers on each car's TeslaMate
## sensor.<car>_energy_added) x (1 + charging loss) x the rate in input_number.ev_electricity_rate.
- sensor:
  - name: "KARR Charging Cost Month"
    unique_id: karr_charging_cost_month
    unit_of_measurement: "$"
    icon: mdi:ev-station
    state: "{{ (states('sensor.karr_charging_energy_month') | float(0) * (1 + states('input_number.ev_charging_loss') | float(0) / 100) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
    attributes:
      energy_kwh: "{{ states('sensor.karr_charging_energy_month') | float(0) | round(1) }}"
      last_month: "{{ (state_attr('sensor.karr_charging_energy_month', 'last_period') | float(0) * (1 + states('input_number.ev_charging_loss') | float(0) / 100) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
  - name: "Orion Charging Cost Month"
    unique_id: orion_charging_cost_month
    unit_of_measurement: "$"
    icon: mdi:ev-station
    state: "{{ (states('sensor.orion_charging_energy_month') | float(0) * (1 + states('input_number.ev_charging_loss') | float(0) / 100) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
    attributes:
      energy_kwh: "{{ states('sensor.orion_charging_energy_month') | float(0) | round(1) }}"
      last_month: "{{ (state_attr('sensor.orion_charging_energy_month', 'last_period') | float(0) * (1 + states('input_number.ev_charging_loss') | float(0) / 100) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
  - name: "Elektra Charging Cost Month"
    unique_id: elektra_charging_cost_month
    unit_of_measurement: "$"
    icon: mdi:ev-station
    state: "{{ (states('sensor.elektra_charging_energy_month') | float(0) * (1 + states('input_number.ev_charging_loss') | float(0) / 100) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
    attributes:
      energy_kwh: "{{ states('sensor.elektra_charging_energy_month') | float(0) | round(1) }}"
      last_month: "{{ (state_attr('sensor.elektra_charging_energy_month', 'last_period') | float(0) * (1 + states('input_number.ev_charging_loss') | float(0) / 100) * states('input_number.ev_electricity_rate') | float(0)) | round(2) }}"
  - name: "EV Charging Cost Month"
    unique_id: ev_charging_cost_month
    unit_of_measurement: "$"
    icon: mdi:ev-station
    state: "{{ (states('sensor.karr_charging_cost_month') | float(0) + states('sensor.orion_charging_cost_month') | float(0) + states('sensor.elektra_charging_cost_month') | float(0)) | round(2) }}"
    attributes:
      last_month: "{{ (state_attr('sensor.karr_charging_cost_month', 'last_month') | float(0) + state_attr('sensor.orion_charging_cost_month', 'last_month') | float(0) + state_attr('sensor.elektra_charging_cost_month', 'last_month') | float(0)) | round(2) }}"
