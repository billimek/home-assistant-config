## Home presence
- sensor:
  - name: "Anyone Home"
    unique_id: anyone_home
    # unavailable (not "not_home") while the group is unknown, e.g. at startup,
    # so the away alerts can't fire from a restart
    availability: "{{ states('group.family') not in ['unknown', 'unavailable'] }}"
    # guest mode reads as "home" so the away-only sensor alerts stay quiet
    state: >
      {{ 'home' if is_state('group.family', 'home')
         or is_state('input_boolean.guest_mode', 'on') else 'not_home' }}

## Jeff's garage
- sensor:
  - name: "Garage Status"
    unique_id: garage_status
    state: >
      {% set door_state = states('cover.jeff_garage_door') %}
      {% if door_state in ['unknown', 'unavailable'] %}
        n/a
      {% else %}
        {{ door_state | title }}
      {% endif %}

  - name: "Garage Car Present"
    unique_id: garage_car_present
    state: >
      {% set door_state = states('cover.jeff_garage_door') %}
      {% set vehicle = states('binary_sensor.og_jeff_vehicle') %}
      {% if door_state in ['unknown', 'unavailable'] %}
        n/a
      {% elif door_state == 'open' %}
        n/a
      {% elif vehicle == 'on' %}
        Yes
      {% else %}
        No
      {% endif %}

