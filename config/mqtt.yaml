################################################
## Garage Door Covers
## (legacy MQTT covers, currently unused by automations: the garage automations
## use cover.jeff_garage_door and cover.jen_garage_door)
################################################
cover:
  - name: "Jens Garage - MQTT"
    command_topic: "og-jen/IN/STATE"
    state_topic: "og-jen/OUT/STATE"
    payload_open: "open"
    payload_close: "close"
    payload_available: "online"
    state_open: "OPEN"
    state_closed: "CLOSED"
    device_class: "garage"

  - name: "Jeffs Garage - MQTT"
    command_topic: "og-jeff/IN/STATE"
    state_topic: "og-jeff/OUT/STATE"
    payload_open: "open"
    payload_close: "close"
    payload_available: "online"
    state_open: "OPEN"
    state_closed: "CLOSED"
    device_class: "garage"

################################################
