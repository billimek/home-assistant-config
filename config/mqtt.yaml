################################################
## Garage Door Covers
## (legacy MQTT covers, currently unused by automations: the garage automations
## use cover.jeff_garage_door and cover.jen_garage_door)
################################################
cover:
  - name: "Jens Garage - MQTT"
    command_topic: "og-jen/IN/STATE"
    state_topic: "og-jen/OUT/STATE"
    payload_open: "open"
    payload_close: "close"
    payload_available: "online"
    state_open: "OPEN"
    state_closed: "CLOSED"
    device_class: "garage"

  - name: "Jeffs Garage - MQTT"
    command_topic: "og-jeff/IN/STATE"
    state_topic: "og-jeff/OUT/STATE"
    payload_open: "open"
    payload_close: "close"
    payload_available: "online"
    state_open: "OPEN"
    state_closed: "CLOSED"
    device_class: "garage"

################################################
## Tesla
## All Tesla telemetry now comes from TeslaMate's built-in MQTT discovery
## (MQTT_DISCOVERY=true): devices Elektra (car 1), KARR (car 2), Orion (car 3).
## Do not re-add hand-written sensors here.
##
## TEMPORARY FALLBACK: the location templates in configuration.yaml
## (device_tracker.tesla{,2,3}_location) now read the discovered
## device_tracker.elektra/karr/orion. These raw lat/lon sensors are kept only so
## the old wiring can be restored quickly if discovery's location updates ever
## misbehave while driving. Remove them once a real drive has been verified.
################################################
sensor:
  - { name: tesla_latitude, state_topic: "teslamate/cars/1/latitude", unit_of_measurement: "°", icon: "mdi:crosshairs-gps" }
  - { name: tesla2_latitude, state_topic: "teslamate/cars/2/latitude", unit_of_measurement: "°", icon: "mdi:crosshairs-gps" }
  - { name: tesla3_latitude, state_topic: "teslamate/cars/3/latitude", unit_of_measurement: "°", icon: "mdi:crosshairs-gps" }
  - { name: tesla_longitude, state_topic: "teslamate/cars/1/longitude", unit_of_measurement: "°", icon: "mdi:crosshairs-gps" }
  - { name: tesla2_longitude, state_topic: "teslamate/cars/2/longitude", unit_of_measurement: "°", icon: "mdi:crosshairs-gps" }
  - { name: tesla3_longitude, state_topic: "teslamate/cars/3/longitude", unit_of_measurement: "°", icon: "mdi:crosshairs-gps" }
