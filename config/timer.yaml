## Snooze timers for phone notification actions (automation/notification_actions.yaml).
## restore: true so a snooze survives an HA restart.
garage_jeff_snooze:
  name: Snooze Jeff's garage door nag
  icon: mdi:bell-sleep
  restore: true
garage_jen_snooze:
  name: Snooze Jen's garage door nag
  icon: mdi:bell-sleep
  restore: true
water_alert_snooze:
  name: Silence repeating water alerts
  icon: mdi:bell-sleep
  restore: true
## Set by the automatic arm/disarm automations so the armed/disarmed pushes are skipped (automation/alarm_logic.yaml)
alarm_auto_disarm:
  name: Automatic alarm arm/disarm in progress
  icon: mdi:shield-off
  duration: '00:00:30'

## Auto-off for input_boolean.guest_mode (automation/guest_mode.yaml)
guest_mode:
  name: Guest mode auto-off
  icon: mdi:account-clock
  duration: '72:00:00'
  restore: true

