- id: '1706749818643'
  alias: 'Camera alerts: porch (only when nobody home)'
  description: 'Frigate push for the porch camera, only while the family group is away. Gated by input_boolean.camera_porch_notify.'
  use_blueprint:
    path: SgtBatten/Beta.yaml
    input:
      camera: camera.porch
      notify_group: ALL_DEVICES
      notify_device: 47982353ddbfc02bcac5e9dd874b2b9f
      disable_times: []
      message: '{{ label }} detected - {{ camera_name }}'
      presence_filter: group.family
      state_filter: true
      state_entity: input_boolean.camera_porch_notify
      state_filter_states:
      - 'on'
