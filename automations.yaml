- id: '1706755452977'
  alias: 'Camera alerts: driveway'
  description: 'Frigate push for the driveway camera whenever nobody is home, or weekdays 09:30-15:00 while someone is home; 2 min cooldown. Gated by input_boolean.camera_driveway_notify.'
  use_blueprint:
    path: SgtBatten/Beta.yaml
    input:
      camera: camera.driveway
      tap_action: /lovelace/camera-driveway
      notify_group: ALL_DEVICES
      notify_device: 47982353ddbfc02bcac5e9dd874b2b9f
      title: '{{ camera_name }}'
      message: '{{ label }} detected'
      icon: "mdi:{{ 'account' if label == 'Person' else 'dog' if label == 'Dog' else 'cat' if label == 'Cat' else 'cctv' }}"
      color: '#00897B'
      labels: [person, dog, cat]
      cooldown: 120
      alert_once: true
      button_3: Mute 1 h
      url_3: CAMERA_MUTE|driveway|60
      icon_3: sfsymbols:bell.slash
      custom_filter: "{{ not is_state('group.family', 'home') or (now().weekday() < 5 and '09:30' <= now().strftime('%H:%M') < '15:00') }}"
      state_filter: true
      state_entity: input_boolean.camera_driveway_notify
      state_filter_states:
      - 'on'
