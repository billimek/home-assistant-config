## Frigate camera pushes: one SgtBatten blueprint instance per camera.
## Each is gated by its input_boolean.camera_<name>_notify toggle (dashboard + "Mute 1 h" button),
## only notifies for person / dog / cat, and has a "Mute 1 h" action button (CAMERA_MUTE|<name>|60,
## handled in automation/notification_actions.yaml). The weekday / overnight / nobody-home rules
## are a custom_filter template; group.family is 'home' while anyone in it is home.
## Guest mode (input_boolean.guest_mode) mutes the porch and pool cameras.
## notify_group ALL_DEVICES (both phones). These bypass script.notify_phones, so notify_test_mode does
## not apply; to test, set notify_group to mobile_app_jeffsphone.
- id: '1707590445295'
  alias: 'Camera alerts: porch'
  description: 'Frigate push for the porch camera overnight (22:00-05:59) or whenever nobody is home. Gated by input_boolean.camera_porch_notify.'
  use_blueprint:
    path: SgtBatten/Beta.yaml
    input:
      camera: camera.porch
      tap_action: /lovelace/camera-porch
      notify_group: ALL_DEVICES
      notify_device: 47982353ddbfc02bcac5e9dd874b2b9f
      title: '{{ camera_name }}'
      message: '{{ label }} detected'
      icon: "mdi:{{ 'account' if label == 'Person' else 'dog' if label == 'Dog' else 'cat' if label == 'Cat' else 'cctv' }}"
      color: '#00897B'
      labels: [person, dog, cat]
      interruption_level: time-sensitive
      alert_once: true
      button_3: Mute 1 h
      url_3: CAMERA_MUTE|porch|60
      icon_3: sfsymbols:bell.slash
      custom_filter: "{{ is_state('input_boolean.guest_mode', 'off') and (now().hour >= 22 or now().hour < 6 or not is_state('group.family', 'home')) }}"
      state_filter: true
      state_entity: input_boolean.camera_porch_notify
      state_filter_states:
      - 'on'
