homeassistant:
  # Name of the location where Home Assistant is running
  name: Home
  # Location required to calculate the time the sun rises and sets
  latitude: !env_var LATITUDE
  longitude: !env_var LONGITUDE
  # Impacts weather/sunrise data (altitude above sea level in meters)
  elevation: 318
  # metric for Metric, imperial for Imperial
  unit_system: us_customary
  country: US
  currency: USD
  # Pick yours from here: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: America/New_York

  external_url: https://hass.eviljungle.com
  internal_url: https://hass.eviljungle.com

default_config:

## Dashboard themes (themes/*.yaml); a new frontend: key needs one restart, after that frontend.reload_themes is enough
frontend:
  themes: !include_dir_merge_named themes

# persist states between restarts
recorder:
  auto_purge: true
  purge_keep_days: 30
  exclude:
    entities:
      - sensor.date
      - sensor.date_time
      - sensor.time
      - sensor.time_utc
      - sensor.system_time_of_day_detailed
      - sensor.network_traffic
    entity_globs:
      - sensor.tx_*
      - sensor.*_tx
      - sensor.*_tx_*
      - sensor.rx_*
      - sensor.*_rx
      - sensor.*_rx_*

prometheus:
  namespace: hass

script: !include_dir_merge_named scripts
# My own handmade automations
automation manual: !include_dir_merge_list automation/
# Automations I create in the UI
automation ui: !include automations.yaml
zone: !include config/zones.yaml
group: !include config/groups.yaml

## Helpers and template entities (config/*.yaml)
input_boolean: !include config/input_boolean.yaml
input_datetime: !include config/input_datetime.yaml
input_number: !include config/input_number.yaml
timer: !include config/timer.yaml
template: !include config/template.yaml

notify:
  - name: ALL_DEVICES
    platform: group
    services:
      - service: mobile_app_jeffsphone
      - service: mobile_app_jensphone

google_assistant:
  project_id: home-assistant-7c48d
  secure_devices_pin: !env_var SECURE_DEVICES_PIN
  service_account: !include home-assistant-7c48d-e078848c9fb0.json
  report_state: true

rest_command:
  wake_wsl:
    url: 'https://opnsense.eviljungle.com:1443/api/wol/wol/set'
    method: POST
    payload: '{"wake":{"interface": "opt3","mac": "d4:5d:64:b4:d8:33"}}'
    content_type: 'application/json'
    username: !env_var OPNSENSE_USER
    password: !env_var OPNSENSE_KEY
