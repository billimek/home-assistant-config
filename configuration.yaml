homeassistant:
  # Name of the location where Home Assistant is running
  name: Home
  # Location required to calculate the time the sun rises and sets
  latitude: !env_var LATITUDE
  longitude: !env_var LONGITUDE
  # Impacts weather/sunrise data (altitude above sea level in meters)
  elevation: 318
  # metric for Metric, imperial for Imperial
  unit_system: us_customary
  country: US
  currency: USD
  # Pick yours from here: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: America/New_York

  external_url: https://hass.eviljungle.com
  internal_url: https://hass.eviljungle.com

default_config:

## Dashboard themes (themes/*.yaml); a new frontend: key needs one restart, after that frontend.reload_themes is enough
frontend:
  themes: !include_dir_merge_named themes

# persist states between restarts
recorder:
  auto_purge: true
  purge_keep_days: 30
  exclude:
    entities:
      - sensor.date
      - sensor.date_time
      - sensor.time
      - sensor.time_utc
      - sensor.system_time_of_day_detailed
      - sensor.network_traffic
    entity_globs:
      - sensor.tx_*
      - sensor.*_tx
      - sensor.*_tx_*
      - sensor.rx_*
      - sensor.*_rx
      - sensor.*_rx_*

prometheus:
  namespace: hass

mqtt: !include config/mqtt.yaml
script: !include_dir_merge_named scripts
# My own handmade automations
automation manual: !include_dir_merge_list automation/
# Automations I create in the UI
automation ui: !include automations.yaml
zone: !include config/zones.yaml
group: !include groups.yaml

## Alarm mode (read by automation/alarm_logic.yaml)
input_select:
  alarm_mode:
    name: Alarm mode
    options:
      - automatic
      - standby
      - night only
    icon: mdi:security-home

## Last time the Dahua doorbell listener delivered an event (see automation/doorbell.yaml watchdog)
input_datetime:
  dahua_last_event:
    name: Dahua last event received
    has_date: true
    has_time: true

## Toggles read by the automations in automation/ (no initial: so the last state survives restarts)
input_boolean:
  # garage stuff
  auto_garage_doors:
    name: Automatically open/close garage doors
  auto_garage_doors_night:
    name: Automatically close garage doors at night

  # auto-run stuff
  auto_arm_disarm_alarm_night:
    name: Arm alarm at midnight and disarm at 5am
  auto_close_garage_door_jen:
    name: Automatically close Jen's Garage Door if open for 2 hours
  auto_close_garage_door_jeff:
    name: Automatically close Jeff's Garage Door if open for 2 hours
  auto_arm_alarm_when_gone:
    name: Automatically arm alarm when no one is home
  auto_disarm_alarm_when_home:
    name: Automatically disarm alarm when someone comes home

  # notifications
  camera_front_notify:
    name: Front camera notifications
  camera_driveway_notify:
    name: Driveway camera notifications
  camera_porch_notify:
    name: Porch camera notifications
  camera_pool_notify:
    name: Pool camera notifications
  camera_doorbell_notify:
    name: Doorbell camera notifications
  notify_alarm_armed:
    name: Notification when alarm is armed
  notify_alarm_disarmed:
    name: Notification when alarm is disarmed
  notify_alarm_triggered:
    name: Notification when alarm is triggered
  notify_garage_doors_home:
    name: Notification when garage doors are open/closed and we are home
  notify_garage_doors_away:
    name: Notification when garage doors are open/closed and we are away

notify:
  - name: ALL_DEVICES
    platform: group
    services:
      - service: mobile_app_jeffsphone
      - service: mobile_app_jensphone

google_assistant:
  project_id: home-assistant-7c48d
  secure_devices_pin: !env_var SECURE_DEVICES_PIN 
  service_account: !include home-assistant-7c48d-e078848c9fb0.json
  report_state: true

tts:
  - platform: google_translate
    cache: false
    # cache_dir: /tmp/tts
    time_memory: 300
    service_name: google_say

rest_command:
  wake_wsl:
      url: 'https://opnsense.eviljungle.com:1443/api/wol/wol/set'
      method: POST
      payload: '{"wake":{"interface": "opt3","mac": "d4:5d:64:b4:d8:33"}}'
      content_type:  'application/json'
      username: !env_var OPNSENSE_USER 
      password: !env_var OPNSENSE_KEY

template:
  ## Home presence
  - sensor:
    - name: "Anyone Home"
      unique_id: anyone_home
      # unavailable (not "not_home") while the group is unknown, e.g. at startup,
      # so the away alerts can't fire from a restart
      availability: "{{ states('group.family') not in ['unknown', 'unavailable'] }}"
      state: "{{ 'home' if is_state('group.family', 'home') else 'not_home' }}"

  ## Jeff's garage
  - sensor:
    - name: "Garage Status"
      unique_id: garage_status
      state: >
        {% set door_state = states('cover.jeff_garage_door') %}
        {% if door_state in ['unknown', 'unavailable'] %}
          n/a
        {% else %}
          {{ door_state | title }}
        {% endif %}

    - name: "Garage Car Present"
      unique_id: garage_car_present
      state: >
        {% set door_state = states('cover.jeff_garage_door') %}
        {% set vehicle = states('binary_sensor.og_jeff_vehicle') %}
        {% if door_state in ['unknown', 'unavailable'] %}
          n/a
        {% elif door_state == 'open' %}
          n/a
        {% elif vehicle == 'on' %}
          Yes
        {% else %}
          No
        {% endif %}

  ## Jen's garage
  - sensor:
    - name: "Garage2 Status"
      unique_id: garage2_status
      state: >
        {% set door_state = states('cover.jen_garage_door') %}
        {% if door_state in ['unknown', 'unavailable'] %}
          n/a
        {% else %}
          {{ door_state | title }}
        {% endif %}

    - name: "Garage2 Car Present"
      unique_id: garage2_car_present
      state: >
        {% set door_state = states('cover.jen_garage_door') %}
        {% set vehicle = states('binary_sensor.og_jen_vehicle') %}
        {% if door_state in ['unknown', 'unavailable'] %}
          n/a
        {% elif door_state == 'open' %}
          n/a
        {% elif vehicle == 'on' %}
          Yes
        {% else %}
          No
        {% endif %}

  ## Alarm panel
  - sensor:
    - name: "Alarm Status"
      unique_id: alarm_status
      availability: "{{ states('alarm_control_panel.ser2sock_10000_alarm_panel') not in ['unknown', 'unavailable'] }}"
      state: "{{ 'Armed' if states('alarm_control_panel.ser2sock_10000_alarm_panel').startswith('armed') else 'Disarmed' }}"

    # Friendly version of the keypad line ("FAULT 17        UPSTAIRS MOTION", "****DISARMED****  Ready to Arm")
    # for the dashboard. Unrecognised messages pass through with the padding/asterisks removed.
    - name: "Alarm Panel Message"
      unique_id: alarm_panel_message
      state: >
        {% set d = states('sensor.ser2sock_10000_alarm_panel_display') | regex_replace('\s+', ' ') | trim %}
        {% if d in ['', 'unknown', 'unavailable'] %}
          Unknown
        {% elif 'READY TO ARM' in d | upper %}
          Ready to arm
        {% elif 'HIT * FOR FAULTS' in d | upper %}
          Not ready, faults open
        {% elif d | regex_match('^FAULT [0-9]+ ', ignorecase=true) %}
          {% set p = d.split(' ', 2) %}
          Open: {{ p[2] | lower | capitalize }} (zone {{ p[1] }})
        {% elif 'MAY EXIT NOW' in d | upper %}
          Exit now
        {% else %}
          {{ d | replace('*', ' ') | regex_replace('\s+', ' ') | trim }}
        {% endif %}

    # What is open or tripped right now, for the dashboard (Home status pill and Security tab)
    - name: "Alarm Zones Active"
      unique_id: alarm_zones_active
      state: >
        {% set z = states.binary_sensor | selectattr('entity_id', 'search', '^binary_sensor\.ser2sock_10000_') | selectattr('state', 'eq', 'on') | list %}
        {% set motion = z | selectattr('attributes.device_class', 'eq', 'motion') | map(attribute='name') | list %}
        {% set opened = z | selectattr('attributes.device_class', 'in', ['door', 'window']) | map(attribute='name') | list %}
        {% set smoke = z | selectattr('attributes.device_class', 'eq', 'smoke') | map(attribute='name') | list %}
        {% set parts = [] %}
        {% if smoke %}{% set parts = parts + ['Smoke: ' ~ smoke | join(', ')] %}{% endif %}
        {% if opened %}{% set parts = parts + ['Open: ' ~ opened | join(', ')] %}{% endif %}
        {% if motion %}{% set parts = parts + ['Motion: ' ~ motion | join(', ')] %}{% endif %}
        {{ parts | join(' · ') if parts else 'All zones closed' }}
      attributes:
        active: >
          {{ states.binary_sensor | selectattr('entity_id', 'search', '^binary_sensor\.ser2sock_10000_') | selectattr('state', 'eq', 'on') | list | count }}

  ## Weekday
  - sensor:
    - name: "Weekday"
      unique_id: weekday
      state: "{{ now().weekday() < 5 }}"

  ## Tesla location tracking, fed by TeslaMate's MQTT discovery trackers
  ## (tesla = Elektra, tesla2 = KARR, tesla3 = Orion).
  ## KEEP these entity ids: the Proximity integration tracks them to produce
  ## sensor.home_tesla{,2,3}_location_distance, which the garage geofence
  ## automations in automation/garage_tesla.yaml trigger on (200 ft crossing).
  - device_tracker:
      - name: "Tesla Location"
        unique_id: tesla_location
        availability: "{{ state_attr('device_tracker.elektra', 'latitude') is number and state_attr('device_tracker.elektra', 'longitude') is number }}"
        latitude: "{{ state_attr('device_tracker.elektra', 'latitude') }}"
        longitude: "{{ state_attr('device_tracker.elektra', 'longitude') }}"
      - name: "Tesla2 Location"
        unique_id: tesla2_location
        availability: "{{ state_attr('device_tracker.karr', 'latitude') is number and state_attr('device_tracker.karr', 'longitude') is number }}"
        latitude: "{{ state_attr('device_tracker.karr', 'latitude') }}"
        longitude: "{{ state_attr('device_tracker.karr', 'longitude') }}"
      - name: "Tesla3 Location"
        unique_id: tesla3_location
        availability: "{{ state_attr('device_tracker.orion', 'latitude') is number and state_attr('device_tracker.orion', 'longitude') is number }}"
        latitude: "{{ state_attr('device_tracker.orion', 'latitude') }}"
        longitude: "{{ state_attr('device_tracker.orion', 'longitude') }}"

